packaging_format = 2

id = "lichenmarkdown"
name = "Lichen-Markdown"
description.en = "permacomputing cms"
description.fr = "permacomputing cms"

version = "1.5.0~ynh1"

maintainers = []

[upstream]
license = "MIT"
admindoc = "https://lichen.commoninternet.net"
code = "https://codeberg.org/ukrudt-net/lichen-markdown/"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin_password]
    type = "password"
    ask = "What password will you use to login to the admin section?"

[resources]
    [resources.sources.main]
    url = "https://codeberg.org/ukrudt-net/lichen-markdown/archive/v1.5.0.zip"
    sha256 = "ad52d0ec4ea69aecd7401661e3131233a967fc1fe7a4377f07f2390c339a167d"
    in_subdir = false

    [resources.system_user]

    [resources.install_dir]
    group = "www-data:rwx"

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "apache2-utils, php8.2-fpm, php8.2-gd, php8.2-zip"

